name: Publish Packages

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npmjs.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run check
          npm test
          npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm dist-tag ls "${package_name}" --registry=https://registry.npmjs.org 2>/dev/null | grep -Eq "^[^:]+: ${package_version}$"; then
            echo "${package_name}@${package_version} already exists on npm. Skipping."
            exit 0
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm publish --access public --ignore-scripts --registry=https://registry.npmjs.org
          else
            npm publish --access public --ignore-scripts --provenance --registry=https://registry.npmjs.org
          fi

  github-packages:
    name: GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@nordbyte"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if npm dist-tag ls "${package_name}" --registry=https://npm.pkg.github.com 2>/dev/null | grep -Eq "^[^:]+: ${package_version}$"; then
            echo "${package_name}@${package_version} already exists on GitHub Packages. Skipping."
            exit 0
          fi

          npm publish --ignore-scripts --registry=https://npm.pkg.github.com
