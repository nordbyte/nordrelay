name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks git . --redact=100 --verbose --report-format=sarif --report-path=gitleaks-results.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif
          if-no-files-found: ignore

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - trufflehog
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Scan common token patterns
        run: |
          set -euo pipefail
          if git grep -I -nE '(ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{40,}|npm_[A-Za-z0-9_]{30,}|[0-9]{8,}:[A-Za-z0-9_-]{35,})' -- ':!.env.example' ':!README.md'; then
            echo "Potential secret-like token found."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: secrets
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm run security:audit
